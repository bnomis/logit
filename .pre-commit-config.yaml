repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.4
    hooks:
      # Run the linter.
      - id: ruff
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # The shared audit hooks, pinned to one commit of the checker.
  # Upgrade with: pre-commit autoupdate --repo git@github.com:bnomis/auditor.git
  - repo: git@github.com:bnomis/auditor.git
    rev: 52b4813c56fdb74f52f86b1e2f3ea46bee2cfae1
    hooks:
      - id: auditme-changed
      - id: auditme-all
        stages: [manual, pre-push]
      # logit is used by many projects, so nothing here names one (AGENTS.md).
      - id: no-project-names
        args: [--allow=logit]
