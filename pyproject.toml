[project]
name = "logit"
version = "0.1.0"
description = "A loguru wrapper."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["loguru>=0.7.3"]

[dependency-groups]
dev = ["hypothesis>=6.158.1", "joblib>=1.5.3", "pytest>=9.1.1", "ruff==0.17.4"]


[tool.pytest.ini_options]
testpaths = ['src/tests']
markers = ['slow: tests that fork processes or sleep; skip with -m "not slow"']


[tool.ruff]
line-length = 160


[tool.ruff.format]
quote-style = 'single'


[tool.ruff.lint]
# B: flake8-bugbear
# E: pycodestyle
# F: Pyflakes
# I: isort
# SIM: flake8-simplify
# UP: pyupgrade
select = [
    'B',
    'E',
    'F',
    'I',
    'SIM',
    "NPY201",
    # 'UP',
]
# ignore
# E501 (line length violations)
# E722 Do not use bare `except`
# SIM108 Use ternary operator
ignore = ['E501', 'E722', 'SIM108']

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = []
known-third-party = ['loguru']
